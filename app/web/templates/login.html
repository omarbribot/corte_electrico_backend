<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alcaldía de Sucre - Acceso Administrativo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-8">
        <div class="text-center mb-8">
            <div class="inline-flex p-3 bg-blue-600 rounded-2xl text-white font-bold text-2xl mb-3 shadow-lg shadow-blue-500/30">⚡</div>
            <h1 class="text-xl font-bold text-white tracking-wide">Alcaldía de Sucre</h1>
            <p class="text-xs text-slate-400 mt-1">Control de Cortes Eléctricos - Panel Administrativo</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="mb-6 p-3 rounded-lg bg-rose-950/60 border border-rose-500/40 text-rose-300 text-xs text-center">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="/login" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Cédula de Administrador</label>
                <input type="text" name="cedula" required placeholder="Ej. 12345678" class="w-full bg-slate-900 border border-slate-600 text-slate-100 text-sm rounded-xl p-3 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Contraseña</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-600 text-slate-100 text-sm rounded-xl p-3 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm py-3.5 rounded-xl transition shadow-lg shadow-blue-600/30">
                Ingresar al Sistema
            </button>
        </form>

        <div class="mt-8 text-center text-xs text-slate-500">
            Servicios Públicos - Municipio Sucre © 2026
        </div>
    </div>
</body>
</html>
